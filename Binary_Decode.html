<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decode Binary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="Projects.html">
        <button id="Back_Button">Back</button>
    </a>
    
    <h1 id="Binary_Decode_H1" >Decode Binary</h1><hr>

    <form id="Decode_Binary_Form">
        <textarea id="Decode_Binary_Text_Box" placeholder="Put Your Message/Binary Here"></textarea>

        <div class="radio-group">
            <input type="radio" id="Decode_Binary_T_To_B" name="Temp_Conversion_unit">
            <label for="Decode_Binary_T_To_B" class="Decode_Binary_Label">Text To Binary</label>
        </div>

        <div class="radio-group">
            <input type="radio" id="Decode_Binary_B_To_T" name="Temp_Conversion_unit">
            <label for="Decode_Binary_B_To_T" class="Decode_Binary_Label">Binary To Text</label>
        </div>

        <button type="button" onclick="Convert()" id="Decode_Binary_Btn">Convert</button>
        <p id="Decode_Binary_Result" class="Decode_Binary_Label">Start By Selecting If You WAnt Text To Binary or Binary To Text And Writing Your Msg</p>
    </form>

    <script src="js/Decode_Binary.js"></script>
</body>
</html>
