<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>generate password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="Projects.html">
        <button id="Back_Button">Back</button>
    </a>
    <h1 id="generate_password_H1">Generate Password</h1><hr>
    
    <div id="Password_Generator_container">
        <button id="Generate_password_btn">Generate password</button><br>
        <div id="Password_Generator_container_2">
            <label for="Generate_password_lower">Include Lower Case: </label>
            <input type="checkbox" id="Generate_password_lower" class="checkbox_password_gen">

            <label for="Generate_password_upper">Include Upper Case: </label>
            <input type="checkbox" id="Generate_password_upper" class="checkbox_password_gen">

            <label for="Generate_password_numbers">Include Numbers: </label>
            <input type="checkbox" id="Generate_password_numbers" class="checkbox_password_gen">

            <label for="Generate_password_symbols">Include Symbols: </label>
            <input type="checkbox" id="Generate_password_symbols" class="checkbox_password_gen"><br><br

            <label for="Password_Gen_length">Length: </label>
            <input type="number" id="Password_Gen_length">
        </div>

        <p id="Generate_password_p"></p>
    </div>
    <script src="js/Password_Generator.js"></script>
</body>
</html>
